# ====================================================================
# Career Compass - Spring Boot Application Configuration
# ====================================================================

spring.application.name=career-compass-backend
server.port=${SERVER_PORT:8080}

# MySQL Database Connection Settings
# Can be overridden by environment variables: DB_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:career_compass}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
# 'update' automatically updates the schema without destroying data on restarts
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Disable Spring SQL script runner to let DataInitializer handle idempotent seeding
spring.sql.init.mode=never

# Do not expose technical stack traces to API clients in production
server.error.include-stacktrace=never
server.error.include-message=always

# Logging configuration
logging.level.com.careercompass=INFO
logging.level.org.springframework.web=INFO
