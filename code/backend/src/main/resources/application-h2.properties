# ====================================================================
# Career Compass - In-Memory H2 Profile (Zero External Database Setup)
# Run with: ./mvnw spring-boot:run -Dspring-boot.run.profiles=h2
# ====================================================================

spring.application.name=career-compass-backend
server.port=${SERVER_PORT:8080}

# In-Memory MySQL-compatible H2 Database
spring.datasource.url=jdbc:h2:mem:career_compass;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Auto create and initialize tables
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Error handling
server.error.include-stacktrace=never
server.error.include-message=always
